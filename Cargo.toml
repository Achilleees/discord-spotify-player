[package]
name = "discord-spotify-player"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Discord - using serenity 0.12 with songbird 0.5
serenity = { version = "0.12.4", default-features = false, features = ["client", "gateway", "model", "voice", "rustls_backend"] }
songbird = { version = "0.5", default-features = true, features = ["serenity", "rustls"] }
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }

# Spotify Connect - staying on 0.4.x due to vergen ecosystem bug in 0.5+
# See AGENTS.md for details on the upgrade attempt
librespot = { version = "0.4" }
librespot-core = "0.4"
librespot-metadata = "0.4"
librespot-playback = "0.4"
librespot-discovery = "0.4"

# Configuration
dotenvy = "0.15"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"  # Fast synchronization primitives
futures-util = "0.3"
hex = "0.4"
rand = "0.8"

