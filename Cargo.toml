[package]
name = "discord-spotify-player"
version = "0.5.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Discord — same voice stack as nob (songbird 0.6 has DAVE natively)
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "voice", "rustls_backend", "cache"] }
songbird = { version = "0.6", features = ["serenity", "gateway", "driver", "rustls"] }
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }

# Spotify Connect (OAuth-only — discovery/mDNS was removed in v0.5)
librespot-core = "0.8"
librespot-connect = "0.8"
librespot-metadata = "0.8"
librespot-playback = "0.8"

# HTTP client for OAuth
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
sha2 = "0.10"            # PKCE code challenge (already compiled via songbird/DAVE)
chacha20poly1305 = "0.10"  # credential-at-rest encryption (already compiled via songbird/DAVE)
pbkdf2 = "0.12"          # key stretching for TOKEN_ENC_KEY (already in tree)

# Configuration
dotenvy = "0.15"
dialoguer = "0.11"

# Credential storage (same schema/version as nob)
rusqlite = { version = "0.32", features = ["bundled"] }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"  # Fast synchronization primitives
futures-util = "0.3"
hex = "0.4"
rand = "0.10"

# YouTube/file playback support
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"

# Force vergen 9.0.6 to fix librespot build (vergen-lib version conflict)
# See: https://github.com/librespot-org/librespot/issues/1681
[build-dependencies]
vergen = "=9.0.6"
vergen-gitcl = "=1.0.5"
