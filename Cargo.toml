[package]
name = "discord-spotify-player"
version = "0.3.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Discord - using serenity 0.12 with songbird 0.5
serenity = { version = "0.12.4", default-features = false, features = ["client", "gateway", "model", "voice", "rustls_backend"] }
songbird = { git = "https://github.com/beerpsi-forks/songbird.git", branch = "davey", default-features = true, features = ["serenity", "rustls"] }
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }

# Spotify Connect
librespot = { version = "0.8" }
librespot-core = "0.8"
librespot-connect = "0.8"
librespot-metadata = "0.8"
librespot-playback = "0.8"
librespot-discovery = "0.8"

# HTTP client for OAuth
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"

# Configuration
dotenvy = "0.15"
dialoguer = "0.11"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"  # Fast synchronization primitives
futures-util = "0.3"
hex = "0.4"
rand = "0.10"

# Force vergen 9.0.6 to fix librespot build (vergen-lib version conflict)
# See: https://github.com/librespot-org/librespot/issues/1681
[build-dependencies]
vergen = "=9.0.6"
vergen-gitcl = "=1.0.5"
