[workspace]
members = [".", "crates/nob"]
default-members = ["."]
resolver = "2"

[package]
name = "discord-spotify-player"
version = "0.5.0-rc2"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Discord — same voice stack as nob (songbird 0.6 has DAVE natively)
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "voice", "rustls_backend", "cache"] }
songbird = { version = "0.6", features = ["serenity", "gateway", "driver", "rustls"] }
# Never imported directly, but load-bearing: songbird declares symphonia with no
# codec features, so this line's "pcm" is what (via feature unification) enables
# decoding RawAdapter's f32 stream. Removing it compiles fine and breaks all audio.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }

# Spotify Connect (OAuth-only — discovery/mDNS was removed in v0.5)
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "1599145bf2c98660d35b17817b3386767a7e4b42" }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "1599145bf2c98660d35b17817b3386767a7e4b42" }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "1599145bf2c98660d35b17817b3386767a7e4b42" }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "1599145bf2c98660d35b17817b3386767a7e4b42" }

# HTTP client for OAuth
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"            # credential hashing (already compiled via songbird/DAVE)
chacha20poly1305 = "0.10"  # credential-at-rest encryption (already compiled via songbird/DAVE)
pbkdf2 = "0.12"          # key stretching for TOKEN_ENC_KEY (already in tree)

# Configuration
dotenvy = "0.15"
dialoguer = "0.11"

# Credential storage (same schema/version as nob)
rusqlite = { version = "0.32", features = ["bundled"] }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"  # Fast synchronization primitives
hex = "0.4"
rand = "0.10"

# YouTube/file playback support
tokio-util = "0.7"  # CancellationToken (sync module is unconditional)
uuid = { version = "1", features = ["v4"] }
thiserror = "1"

